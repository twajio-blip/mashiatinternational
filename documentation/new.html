    <script>
        $(document).ready(function () {
            // Load content dynamically based on the clicked header link
            $(".header-link").on("click", function (e) {
                e.preventDefault();
                const target = $(this).attr("href").substring(1);

                // Update active link styles
                $(".header-link").removeClass("active-header");

                const content = {

                    "introduction": `<div>
                        <h2 class="text-[40px] text-[#232323] font-medium mb-5">Introduction</h2>

        <p class="text-[#232323] text-[14px]">DSS Business Website enables users to build fully functional business websites effortlessly. It comes equipped with intuitive tools and customizable templates, allowing you to craft websites that suit your unique brand and business needs. With this software, you can create dynamic, engaging, and professional-looking websites without requiring advanced technical expertise.</p>
        <h3 class="text-[24px] text-[#232323] font-medium mt-5">Key Features</h3>
        <ul class="pl-10 list-decimal text-[14px] text-[#232323] space-y-1">
            <li><strong>Pre-Designed Sections and Pages</strong>: Build your website with ready-to-use templates for essential pages like:
                <ul class="pl-10 list-disc py-2">
                    <li><strong>About Us</strong>: Share your company’s story, mission, and values.</li>
                    <li><strong>Contact Us</strong>: Provide your audience with a way to get in touch.</li>
                    <li><strong>Employee Profiles</strong>: Showcase your team members and their roles.</li>
                    <li><strong>Services</strong>: Highlight the services you offer with detailed descriptions.</li>
                    <li><strong>Blog</strong>: Share articles, updates, and insights to engage your audience.</li>
                    <li><strong>Gallery</strong>: Display images of your work, events, or products.</li>
                </ul>
            </li>
            <li><strong>User-Friendly Interface</strong>: A drag-and-drop builder and straightforward content management system make it easy for anyone to use.</li>
            <li><strong>Customizability</strong>: Personalize your website with color schemes, fonts, layouts, and more to reflect your brand identity.</li>
            <li><strong>Responsive Design</strong>: All websites built with this software are optimized for viewing on desktops, tablets, and mobile devices.</li>
            <li><strong>SEO and Analytics Tools</strong>: Enhance your website’s visibility on search engines and track performance with built-in tools.</li>
        </ul>

    

        <h3 class="text-[24px] text-[#232323] font-medium mt-5">Target Audience</h3>
        <p class="text-[#232323] text-[14px] mt-2"><strong>This software is designed for:</strong></p>
        <ul class="pl-10 list-decimal text-[14px] text-[#232323] space-y-1 mb-2">
            <li>Entrepreneurs and small business owners looking to establish their first website.</li>
            <li>Agencies and freelancers creating websites for clients.</li>
            <li>Medium to large enterprises aiming to build or revamp their online presence.</li>
            <li>Anyone seeking an all-in-one solution to build a professional business website.</li>
        </ul>

        <p class="text-[#232323] text-[14px] mt-4">By using <strong>DDSS Business Website</strong>, you can focus on growing your business while we take care of providing you with the tools needed to make a lasting impression online.</p>
    
                    `,
                    "features": `
                       <main>
            <h2 class="text-[40px] text-[#232323] font-medium mb-5">Prerequisites</h2>
            <ul class="pl-10 list-disc text-[14px] text-[#232323] space-y-1">
                <li>A code editor (e.g., Visual Studio Code, Sublime Text).</li>
                <li>A web browser (e.g., Chrome, Firefox).</li>
                <li>Basic knowledge of HTML and CSS.</li>
            </ul>
    
            <h3 class="text-[24px] text-[#232323] font-medium mt-5">Step 1: Download the Source Code</h3>
            <p class="text-[#232323] text-[14px] mt-2">Download the project files from the Theme Forest:</p>

    
            <h2 class="text-[24px] text-[#232323] font-medium mt-5">Step 2: Open the Project</h2>
            <p class="text-[#232323] text-[14px] mt-2">Navigate to the project folder and open the <code>index.html</code> file in your code editor.</p>
    
            <h2 class="text-[24px] text-[#232323] font-medium mt-5">Step 3: Verify Tailwind CSS</h2>
            <p class="text-[#232323] text-[14px] mt-2">The project uses Tailwind CSS via a CDN link. Ensure the following line is present in the <code>&lt;head&gt;</code> section of your <code>index.html</code>:</p>
            <div class="code-container relative">
                    <button class="copy-code-btn absolute top-6 right-2 px-4 py-2 bg-white text-white text-opacity-60 bg-opacity-[0.06]"><span><i class="fa-regular fa-copy"></i></span></button>
                    <span class="copy-message absolute top-6 right-14 px-4 py-2 bg-white text-white text-opacity-60 bg-opacity-[0.06] overflow-hidden inline-block opacity-0 transition-opacity duration-500">Copied text</span>
                    <pre
                        class="optional-sizes-code w-full rounded-md text-sm z-50">
                        <code class="language-html rounded-md shadow-md">
&lt;link href=&quot;https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css&quot; rel=&quot;stylesheet&quot;&gt;
                        </code>
                    </pre>
                </div>
            <p class="text-[#232323] text-[14px] mt-2">This link ensures Tailwind CSS is loaded and ready to style your website.</p>
    
            <h2 class="text-[24px] text-[#232323] font-medium mt-5">Step 4: Verify jQuery</h2>
            <p class="text-[#232323] text-[14px] mt-2">The project also includes jQuery for dynamic interactions. Verify the following script tag is included at the end of the <code>&lt;body&gt;</code> section:</p>
            <div class="code-container relative">
                    <button class="copy-code-btn absolute top-6 right-2 px-4 py-2 bg-white text-white text-opacity-60 bg-opacity-[0.06]"><span><i class="fa-regular fa-copy"></i></span></button>
                    <span class="copy-message absolute top-6 right-14 px-4 py-2 bg-white text-white text-opacity-60 bg-opacity-[0.06] overflow-hidden inline-block opacity-0 transition-opacity duration-500">Copied text</span>
                    <pre
                        class="optional-sizes-code w-full rounded-md text-sm z-50">
                        <code class="language-html rounded-md shadow-md">
&lt;script src="https://code.jquery.com/jquery-3.6.0.min.js"&gt;&lt;/script&gt;
                        </code>
                    </pre>
                </div>
            <p class="text-[#232323] text-[14px] mt-2">This link loads the jQuery library into your project.</p>
    
            <h2 class="text-[24px] text-[#232323] font-medium mt-5">Step 5: Open the Project in a Browser</h2>
            <p class="text-[#232323] text-[14px] mt-2">Use any browser to view the website:</p>
            <ul class="pl-10 list-disc text-[14px] text-[#232323] space-y-1">
                <li>Open the <code>index.html</code> file directly in the browser.</li>
                <li>Alternatively, use a local server for development:</li>
            </ul>
            <div class="code-container relative">
                    <button class="copy-code-btn absolute top-6 right-2 px-4 py-2 bg-white text-white text-opacity-60 bg-opacity-[0.06]"><span><i class="fa-regular fa-copy"></i></span></button>
                    <span class="copy-message absolute top-6 right-14 px-4 py-2 bg-white text-white text-opacity-60 bg-opacity-[0.06] overflow-hidden inline-block opacity-0 transition-opacity duration-500">Copied text</span>
                    <pre
                        class="optional-sizes-code w-full rounded-md text-sm z-50">
                        <code class="language-html rounded-md shadow-md">
# If you have Python installed, run:
    python -m http.server
                        </code>
                    </pre>
                </div>
    
            <h2 class="text-[24px] text-[#232323] font-medium mt-5">Step 6: Customization</h2>
            <p class="text-[#232323] text-[14px] mt-2">To modify or add features:</p>
            <ul class="pl-10 list-disc text-[14px] text-[#232323] space-y-1">
                <li>Edit the HTML files to update content and structure.</li>
                <li>Customize the design by adding or updating Tailwind CSS classes in your HTML elements.</li>
                <li>Enhance interactivity by adding custom JavaScript/jQuery code in the provided <code>script.js</code> file or directly in your HTML.</li>
            </ul>
    
        </main>
                    `,

                };

                // Update the content area
                $("#content-area").html(content[target]);
                // Apply Highlight.js to the new code block

                $('.code-container pre code').each(function (i, block) {
                    hljs.highlightElement(block);
                });
            });
        });
        hljs.highlightAll();
        $(document).on('click','.copy-code-btn',function () {
            let text = $(this).closest('.code-container').find('code').text();
            navigator.clipboard.writeText(text);

            $(this).closest('.code-container').find('.copy-message').addClass('opacity-100').removeClass('opacity-0');
            setTimeout(() => {
                $(this).closest('.code-container').find('.copy-message').removeClass('opacity-100').addClass('opacity-0');
            }, 1000);
        })
    </script>

</body>
